{% extends "base.html" %}

{% block meta %}
<title>Faeiz Faiza Fasha - Blog - {{ title }}</title>
{% endblock%}

{% block content %}
<div class="main-content">
    <article>
        <h1>{{ title }}</h1>
        <p>[{{ created_at }}]</p>
        {{ html }}

    <div class="action">
        {% include "components/instance_star.html" with instance=blog toggle_star_view='main:blog:toggle_star' %}
    </div>
</div>
{% endblock %}
