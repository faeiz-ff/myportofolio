<div id="add-project-modal"
     class="model-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="add-project-modal-title">
    <button type="button"
            class="model-delete-modal__backdrop"
            popovertarget="add-project-modal"
            popovertargetaction="hide"
            aria-label="Tutup form tambah proyek"></button>

    <div class="model-delete-modal__content">
        <button type="button"
                class="model-delete-modal__close"
                popovertarget="add-project-modal"
                popovertargetaction="hide"
                aria-label="Tutup form tambah proyek">×</button>

        <h2 id="add-project-modal-title">Tambah Proyek Baru</h2>
        <form 
            method="post" 
            action="{% url 'main:project:create' %}"
            class="model-form">
            {% csrf_token %}
            {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
            </div>
            {% for error in field.errors %}
            <p class="form-error form-group">{{ error }}</p>
            {% endfor %}
            {% endfor %}
            <div class="model-delete-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="add-project-modal"
                        popovertargetaction="hide">Batal</button>
                <button type="submit" class="button">Tambah Proyek</button>
            </div>
        </form>
    </div>
</div>
