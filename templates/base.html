<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faeiz Faiza Fasha - Portfolio</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div class="main-page">
    <header class="main-header">
        <div>
            <h1>Faeiz &middot; Portfolio </h1>
            <p>Computer Science &commat; Universitas Indonesia</p>
        </div>
        <nav class="profile-links">
            <a href="/">./home</a>
            <a href="/proyek">./proyek</a>
            <a href="/tentang">./tentang</a>
            <a href="/manifesto">./manifesto</a>
        </nav>
        <label class="theme-picker">
            <input type="checkbox" id="theme-light" name="theme-light" checked/>
            <span id="theme-picker-light">Light</span>
            <span id="theme-picker-dark">Dark</span>
        </label>
    </header>
    <main>
        {% block content %}
        {% endblock %}
    </main>
    <footer>
        <div>
            <p>&copy; 2026 Faeiz Faiza Fasha. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
        </div>
    </footer>
    </div>

    <script>
        // Theme Picker Logic
        const themeCheckBox = document.getElementById('theme-light');
        const savedTheme = localStorage.getItem('theme-color');
        const prefersLight = window.matchMedia('(prefers-color-scheme: light)');

        if (savedTheme === 'light') {
            themeCheckBox.checked = true;
        } else if (savedTheme === 'dark') {
            themeCheckBox.checked = false;
        } else if (prefersLight) {
            themeCheckBox.checked = true;
            localStorage.setItem('theme-color', 'light');
        } else {
            themeCheckBox.checked = false;
            localStorage.setItem('theme-color', 'dark');
        }

        themeCheckBox.addEventListener('change', (e) => {
            localStorage.setItem('theme-color', e.target.checked ? 'light' : 'dark');
        });
    </script>
</body>

</html>
